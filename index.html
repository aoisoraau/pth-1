<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時、人、地、事！！！</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">

    <style>
        /* 1. 關鍵修正：確保寬度包含邊框和內距 */
        * {
            box-sizing: border-box;
        }

        :root {
            --bg-color: #FFF3E0;
            --card-shadow: 0 6px 0 rgba(0,0,0,0.15);
            --blue: #42A5F5;
            --yellow: #FFEE58;
            --green: #66BB6A;
            --orange: #FF7043;
            --purple: #AB47BC;
            --card-width: 135px;
            --card-height: 230px;
        }

        body {
            font-family: "M PLUS Rounded 1c", "Microsoft JhengHei", sans-serif;
            text-align: center;
            background-color: var(--bg-color);
            background-image: radial-gradient(#FFCCBC 15%, transparent 16%), radial-gradient(#FFCCBC 15%, transparent 16%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            /* 允許頁面本身出現捲軸，防止內容被強制切斷 */
            overflow-x: auto; 
            padding: 10px;
        }

        h1 { 
            color: #5D4037; 
            font-weight: 800; 
            font-size: 2.5rem;
            margin: 5px 0 15px 0;
            text-shadow: 3px 3px 0px #FFF;
        }

        /* 遊戲主舞台 */
        .game-board {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            
            /* 2. 關鍵修正：加大左右內距，尤其是右邊，防止切邊 */
            padding: 20px 40px; 
            
            border-radius: 30px;
            border: 6px solid #FFF;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            
            display: inline-flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px; /*稍微加大間距*/
            
            flex-wrap: nowrap; 
            /* 移除過於嚴格的 max-width，改用 fit-content 配合 min-width */
            width: fit-content;
            min-width: fit-content;
            
            transition: all 0.5s ease;
        }

        .card {
            width: var(--card-width);
            height: var(--card-height);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: white;
            box-shadow: var(--card-shadow);
            position: relative;
            border: 3px solid white;
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        @keyframes bounce {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .card.pop { animation: bounce 0.5s ease-out; }

        .time   { background: #E3F2FD; border-color: var(--blue); color: #1565C0; } 
        .person { background: #FFFDE7; border-color: #FBC02D; color: #F57F17; }
        .place  { background: #E8F5E9; border-color: var(--green); color: #2E7D32; }
        .action { background: #FFEBEE; border-color: var(--orange); color: #C62828; }
        .object { background: #F3E5F5; border-color: var(--purple); color: #6A1B9A; }

        .emoji-display { 
            font-size: 55px; 
            margin: 8px 0; 
            filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.1));
        }
        
        .text-display { 
            font-size: 22px; 
            font-weight: 800; 
            margin-bottom: 4px; 
            padding: 0 2px; 
            word-wrap: break-word;
            line-height: 1.2;
        }
        
        .pinyin-display { 
            font-size: 13px; 
            font-weight: 500;
            opacity: 0.7;
            font-family: "Verdana", sans-serif;
        }
        
        .label { 
            position: absolute; 
            top: 6px; 
            left: 0; 
            width: 100%;
            text-align: center;
            font-size: 11px; 
            opacity: 0.6; 
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button {
            margin-top: 25px;
            padding: 12px 50px;
            font-size: 24px;
            font-family: "M PLUS Rounded 1c", sans-serif;
            font-weight: 800;
            color: white;
            background: linear-gradient(to bottom, #FFAB91, #FF5722);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #D84315, 0 15px 20px rgba(0,0,0,0.2);
            transition: all 0.1s;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        button:active { transform: translateY(6px); box-shadow: 0 0 0 #D84315; }
        
        .full-sentence-box {
            margin-top: 25px;
            background: white;
            padding: 15px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 4px solid #FFCCBC;
            max-width: 95%;
            position: relative;
        }
        .full-sentence-box::before {
            content: "";
            position: absolute;
            top: -20px;
            left: 50%;
            margin-left: -10px;
            border-width: 10px;
            border-style: solid;
            border-color: transparent transparent #FFCCBC transparent;
        }

        .full-sentence { 
            font-size: 28px; 
            color: #3E2723; 
            font-weight: 800; 
            line-height: 1.4; 
        }

        /* 滑出動畫容器 */
        .slide-container {
            display: flex;
            gap: 10px; /* 與主容器一致 */
            width: 0;
            opacity: 0;
            overflow: hidden;
            /* 增加一點 padding 防止內部的陰影被切掉 */
            padding-right: 5px; 
            padding-bottom: 10px; /* 預留下方陰影空間 */
            margin-bottom: -10px; /* 抵消 padding 造成的版面位移 */
            transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
        }

        /* RWD */
        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; }
            /* 手機上允許縮小以適應 */
            .game-board { transform: scale(0.8); transform-origin: top center; margin-left: -10%; width: 120%; }
        }

    </style>
</head>
<body>

    <h1>時、人、地、事！！！</h1>

    <div class="game-board">
        <div class="card time" id="c1">
            <span class="label">時間 Time</span>
            <div class="emoji-display" id="e1">📅</div>
            <div class="text-display" id="t1">今天</div>
            <div class="pinyin-display" id="p1">gam1 tin1</div>
        </div>
        <div class="card person" id="c2">
            <span class="label">人物 Who</span>
            <div class="emoji-display" id="e2">🙂</div>
            <div class="text-display" id="t2">我</div>
            <div class="pinyin-display" id="p2">ngo5</div>
        </div>
        <div class="card place" id="c3">
            <span class="label">地點 Where</span>
            <div class="emoji-display" id="e3">🏫</div>
            <div class="text-display" id="t3">在學校</div>
            <div class="pinyin-display" id="p3">zoi6 hok6 haau6</div>
        </div>
        <div class="card action" id="c4">
            <span class="label">事情 Action</span>
            <div class="emoji-display" id="e4">🏃</div>
            <div class="text-display" id="t4">跑步</div>
            <div class="pinyin-display" id="p4">paau2 bou6</div>
        </div>

        <div class="slide-container" id="extraSlots">
            <div class="card object" id="c5">
                <div class="emoji-display" id="e5">❓</div>
                <div class="text-display" id="t5">...</div>
                <div class="pinyin-display" id="p5">...</div>
            </div>
            <div class="card object" id="card6" style="display:none;">
                <div class="emoji-display" id="e6">📢</div>
                <div class="text-display" id="t6">叫</div>
                <div class="pinyin-display" id="p6">giu3</div>
            </div>
        </div>
    </div>

    <button onclick="spin()">🎲 變身 (GO!)</button>

    <div class="full-sentence-box">
        <div class="full-sentence" id="result">按一下按鈕開始！</div>
    </div>

    <script>
        const data = {
            time: [
                {t:"今天", e:"📅", p:"gam1 tin1"}, {t:"昨天", e:"🔙", p:"zok3 tin1"},
                {t:"明天", e:"🔜", p:"ming4 tin1"}, {t:"早上", e:"🌅", p:"zou2 soeng6"},
                {t:"中午", e:"☀️", p:"zung1 ng5"}, {t:"晚上", e:"🌙", p:"maan5 soeng6"},
                {t:"週末", e:"🎡", p:"zau1 mut6"}, {t:"現在", e:"👇", p:"jin6 zoi6"}
            ],
            person: [
                {t:"我", e:"🙋‍♂️", p:"ngo5"}, {t:"你", e:"👉", p:"nei5"},
                {t:"爸爸", e:"👨", p:"baa4 baa1"}, {t:"媽媽", e:"👩", p:"maa1 maa1"},
                {t:"老師", e:"👩‍🏫", p:"lou5 si1"}, {t:"同學", e:"🎒", p:"tung4 hok6"},
                {t:"小狗", e:"🐶", p:"siu2 gau2"}, {t:"貓", e:"🐱", p:"maau1"},
                {t:"弟弟", e:"👶", p:"dai4 dai2"}, {t:"妹妹", e:"👱‍♀️", p:"mui4 mui2"}
            ],
            place: [
                {t:"學校", e:"🏫", p:"hok6 haau6"}, {t:"家裏", e:"🏠", p:"gaa1 leoi5"},
                {t:"公園", e:"🌳", p:"gung1 jyun2"}, {t:"超市", e:"🛒", p:"ciu1 si5"},
                {t:"圖書館", e:"📚", p:"tou4 syu1 gun2"}, {t:"商場", e:"🛍️", p:"soeng1 coeng4"}
            ],
            action: [
                {t:"跑步", e:"🏃", p:"paau2 bou6"}, 
                {t:"睡覺", e:"😴", p:"seoi6 gaau3"},
                {t:"看見", e:"👀", p:"hon3 gin3"}, 
                {t:"聽見", e:"👂", p:"teng1 gin3"}, 
                {t:"打掃", e:"🧹", p:"daa2 sou3"},
                {t:"照顧", e:"🤗", p:"ziu3 gu3"},
                {t:"學習", e:"📝", p:"hok6 zaap6"},
                {t:"吃飯", e:"🍚", p:"hek3 faan6"}
            ]
        };

        function spin() {
            animateCards();

            const extraContainer = document.getElementById('extraSlots');
            const card6 = document.getElementById('card6');
            
            extraContainer.style.width = '0px';
            extraContainer.style.opacity = '0';
            card6.style.display = 'none'; 

            const t = getRandom(data.time);
            const p = getRandom(data.person);
            const pl = getRandom(data.place);
            const a = getRandom(data.action);

            updateCard('e1', 't1', 'p1', t);
            updateCard('e2', 't2', 'p2', p);
            
            document.getElementById('e3').innerText = pl.e;
            document.getElementById('t3').innerText = "在" + pl.t;
            document.getElementById('p3').innerText = "zoi6 " + pl.p;

            updateCard('e4', 't4', 'p4', a);

            let fullSentence = `${t.t}，${p.t}在${pl.t}${a.t}`;
            let extraObj = null;
            let widthToExpand = '0px';
            let hasExtra = false;

            if (["看見", "照顧", "聽見", "學習"].includes(a.t)) {
                hasExtra = true;
                
                if (a.t === "看見" || a.t === "照顧") {
                    extraObj = getRandom(data.person);
                    fullSentence += extraObj.t;
                    // 3. 關鍵修正：寬度改為 150px (原135)，給予緩衝
                    widthToExpand = '150px';

                } else if (a.t === "聽見") {
                    extraObj = getRandom(data.person);
                    fullSentence += (extraObj.t + "叫");
                    // 3. 關鍵修正：寬度改為 300px (原278)，給予緩衝
                    widthToExpand = '300px';
                    
                    document.getElementById('e6').innerText = "📢";
                    document.getElementById('t6').innerText = "叫";

                } else if (a.t === "學習") {
                    extraObj = {t:"中文", e:"🀄", p:"zung1 man4"};
                    fullSentence += extraObj.t;
                    widthToExpand = '150px';
                }

                if (extraObj) {
                    updateCard('e5', 't5', 'p5', extraObj);
                }
            }

            fullSentence += "。";
            document.getElementById('result').innerText = fullSentence;
            speak(fullSentence);

            if (hasExtra) {
                setTimeout(() => {
                    if (a.t === "聽見") {
                        card6.style.display = 'flex';
                    }
                    
                    extraContainer.style.width = widthToExpand;
                    extraContainer.style.opacity = '1';

                    document.getElementById('c5').classList.remove('pop');
                    void document.getElementById('c5').offsetWidth;
                    document.getElementById('c5').classList.add('pop');

                }, 250);
            }
        }

        function animateCards() {
            const ids = ['c1', 'c2', 'c3', 'c4'];
            ids.forEach(id => {
                const el = document.getElementById(id);
                el.classList.remove('pop');
                void el.offsetWidth;
                el.classList.add('pop');
            });
        }

        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function updateCard(eid, tid, pid, obj) {
            document.getElementById(eid).innerText = obj.e;
            document.getElementById(tid).innerText = obj.t;
            document.getElementById(pid).innerText = obj.p;
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-HK';
                utterance.rate = 0.8;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>

</body>
</html>
